# Serves the compiled React Router SPA (build/client) on port 80
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Inherited by every location below (none of them uses add_header).
    # SAMEORIGIN rather than DENY: MSAL can load the redirect URI in a same-origin iframe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Used by the container HEALTHCHECK
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these files, so they can be cached for a year. A missing chunk
    # must be a 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routing: /login, /reservas, /gimnasios/1... are resolved by the SPA.
    # index.html must always be revalidated so a new deploy is picked up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
