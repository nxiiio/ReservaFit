spring:
  output:
    ansi:
      enabled: always
  application:
    name: ReservaFit-Backend
  jpa:
    # Run data.sql after Hibernate creates the schema
    defer-datasource-initialization: true
  sql:
    init:
      encoding: UTF-8
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          # spring-cloud-azure-starter-active-directory rejects the "consumers" alias
          # outright for resource-server scenarios; use the resolved tenant GUID instead
          # (confirmed earlier: Microsoft's /consumers/v2.0 discovery doc self-declares
          # this as its issuer tenant).
          tenant-id: 9188040d-6c67-4c5b-b112-36a304b66dad
        credential:
          client-id: f4a5103b-ae57-406d-85e1-eee64edbc4ac
        app-id-uri: api://f4a5103b-ae57-406d-85e1-eee64edbc4ac
        # Nimbus defaults are 500 ms; the first JWK set fetch from Microsoft often
        # takes longer and fails with "I/O error ... : null" (a 500, not a 401)
        jwt-connect-timeout: 5s
        jwt-read-timeout: 5s
