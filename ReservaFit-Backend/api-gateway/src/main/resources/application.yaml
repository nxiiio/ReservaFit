# Single entry point for the frontend: it keeps calling http://localhost:8080 and each request
# is forwarded unchanged (Authorization header included) to the service that owns the path.
# The gateway does not validate tokens: every service keeps its own SecurityConfig, copied
# unchanged from the original monolith. CORS is answered here (see CorsConfig), and each route
# drops the Origin header so the services do not add a second set of CORS headers.
server:
  port: 8080
spring:
  output:
    ansi:
      enabled: always
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Availability is computed from bookings, so it lives in ms-reservas even though
            # its path is under /api/gimnasios. Lower order wins, so it is checked first.
            - id: disponibilidad
              uri: ${RESERVAS_URL:http://localhost:8083}
              order: -1
              predicates:
                - Path=/api/gimnasios/*/disponibilidad
              filters:
                - RemoveRequestHeader=Origin
            - id: usuarios
              uri: ${USUARIOS_URL:http://localhost:8081}
              predicates:
                - Path=/api/usuarios/**
              filters:
                - RemoveRequestHeader=Origin
            - id: gimnasios
              uri: ${GIMNASIOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/gimnasios/**
              filters:
                - RemoveRequestHeader=Origin
            - id: reservas
              uri: ${RESERVAS_URL:http://localhost:8083}
              predicates:
                - Path=/api/reservas/**
              filters:
                - RemoveRequestHeader=Origin
            - id: notificaciones
              uri: ${NOTIFICACIONES_URL:http://localhost:8084}
              predicates:
                - Path=/api/notificaciones/**
              filters:
                - RemoveRequestHeader=Origin

app:
  cors:
    # Comma-separated list of browser origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
